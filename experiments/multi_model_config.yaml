# Multi-Model Experiment Configuration
# Define the models to test for external validity

models:
  # OpenAI Frontier + Variants
  - name: "gpt-5.1"
    provider: "openai"
    model_id: "gpt-5.1"

  - name: "gpt-4.1"
    provider: "openai"
    model_id: "gpt-4.1"

  - name: "gpt-4.1-mini"
    provider: "openai"
    model_id: "gpt-4.1-mini"

  - name: "gpt-4o-mini"
    provider: "openai"
    model_id: "gpt-4o-mini"

  # Anthropic Frontier Models (from your /v1/models output)
  - name: "claude-opus-4.5"
    provider: "anthropic"
    model_id: "claude-opus-4-5-20251101"

  - name: "claude-sonnet-4.5"
    provider: "anthropic"
    model_id: "claude-sonnet-4-5-20250929"

  - name: "claude-haiku-4.5"
    provider: "anthropic"
    model_id: "claude-haiku-4-5-20251001"

  # Meta (via Together AI)
  - name: "llama-4-maverick-17b"
    provider: "together"
    model_id: "meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8"

  # Together retired the FP8 serverless endpoint, and FP4 is dedicated-endpoint-only.
  # Verified 2026-08-25 by probing with real requests: Together's serverless tier on
  # this account serves exactly three chat models — the two below plus gpt-oss-20b.
  # The Maverick entry above is kept as the record of what the thesis ran.
  # Phase 0.5 uses the two entries below. See PHASE_0.5_SPEC.md §3.
  - name: "llama-3.3-70b-turbo"
    provider: "together"
    model_id: "meta-llama/Llama-3.3-70B-Instruct-Turbo"

  - name: "gpt-oss-120b"
    provider: "together"
    model_id: "openai/gpt-oss-120b"

  - name: "gpt-oss-20b"
    provider: "together"
    model_id: "openai/gpt-oss-20b"

  # Phase 0.5 judge (§5) — third vendor relative to both evaluated models. Not on
  # Together: with only Meta and OpenAI available there, family independence is
  # unsatisfiable within Together's serverless tier.
  - name: "claude-haiku-4-5"
    provider: "anthropic"
    model_id: "claude-haiku-4-5"

  # Mistral / Mixtral (via Together AI)
  - name: "mixtral-8x7b"
    provider: "together"
    model_id: "mistralai/Mixtral-8x7B-Instruct-v0.1"

  # Qwen (via Together AI)
  - name: "qwen-3-next-80b"
    provider: "together"
    model_id: "Qwen/Qwen3-Next-80B-A3B-Instruct"
